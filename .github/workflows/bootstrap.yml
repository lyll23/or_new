name: Install pinned reviewed source
on: workflow_dispatch
permissions:
  contents: write
jobs:
  install:
    if: github.repository == 'lyll23/or_new' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
      - name: Verify and install only the 20 reviewed source files; preserve README
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib, io, pathlib, zipfile
          p = pathlib.Path('or-new-source-bootstrap.zip')
          expected = '2967d74f556e3608596af6ebea091f7d67c439ad11f95f6f65199217731f1adb'
          blob = p.read_bytes()
          assert hashlib.sha256(blob).hexdigest() == expected, 'ZIP SHA mismatch'
          with zipfile.ZipFile(io.BytesIO(blob)) as z:
              code = z.read('_bootstrap/install.py')
          exec(compile(code, '_bootstrap/install.py', 'exec'), {'__name__': '__main__', 'SOURCE_ZIP': str(p), 'SOURCE_SHA256': expected})
          PY
