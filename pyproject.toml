[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "or-new-pipeline"
version = "0.1.0"
description = "Full-catalog public OpenRouter capture and verifiable local research data ingestion"
requires-python = ">=3.11"
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.data-files]
"share/or_new/config" = ["config/*.json"]
